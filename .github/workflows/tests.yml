name: CI

on:
  push:
    branches: ["main", "master", "ci/pipeline-fix"]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-quality:
    runs-on: ubuntu-latest
    env:
    SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
    SONAR_TOKEN: ${{ secrets.SONAR_TOKEN || secrets.MS_SONAR_TOKEN }}
    SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION || secrets.MS_SONAR_ORGANIZATION || github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: xdebug

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Coding standards
        run: vendor/bin/phpcs

      - name: Static analysis
        run: vendor/bin/phpstan

      - name: Tests with coverage
        run: composer test:coverage

      - name: Coverage gate
        run: composer coverage:check

      - name: Prepare Sonar gate
        run: |
          if [ -n "${SONAR_TOKEN:-}" ]; then
            echo "HAS_SONAR_TOKEN=true" >> "$GITHUB_ENV"
          else
            echo "HAS_SONAR_TOKEN=false" >> "$GITHUB_ENV"
          fi

      - name: SonarQube scan
        if: ${{ env.HAS_SONAR_TOKEN == 'true' }}
        uses: sonarsource/sonarqube-scan-action@v2
        with:
          args: >
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}

      - name: Build image
        run: docker build -t ms-os-service:local .

  deploy-k8s:
    runs-on: ubuntu-latest
    needs: build-test-quality
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: tech-challenge

      - name: Build image
        run: docker build -t ms-os-service:local .

      - name: Load image into kind
        run: kind load docker-image --name tech-challenge ms-os-service:local

      - name: Deploy
        run: |
          set -euo pipefail
          kubectl apply -f k8s/namespace.yaml || true

          echo "Waiting for namespace 'tech-challenge' to become Active"
          for i in $(seq 1 60); do
            phase=$(kubectl get ns tech-challenge -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            if [ "$phase" = "Active" ]; then
              break
            fi
            sleep 1
          done

          kubectl apply --server-side -f k8s --recursive
